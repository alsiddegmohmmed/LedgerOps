name: LedgerOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ledgerops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    name: Gradle verification
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run complete test suite
        run: ./gradlew clean test --console=plain --stacktrace

      - name: Run project checks
        run: ./gradlew check --console=plain --stacktrace

  frontend:
    name: Operations Web verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21 for the real Core E2E topology
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle for the real Core E2E topology
        uses: gradle/actions/setup-gradle@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Set up Node.js 24.18.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: applications/operations-web/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: applications/operations-web
        run: pnpm install --frozen-lockfile

      - name: Lint frontend
        working-directory: applications/operations-web
        run: pnpm lint

      - name: Typecheck frontend
        working-directory: applications/operations-web
        run: pnpm typecheck

      - name: Run frontend unit tests
        working-directory: applications/operations-web
        run: pnpm test

      - name: Install Playwright browser
        working-directory: applications/operations-web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: applications/operations-web
        run: pnpm exec playwright test

      - name: Build frontend
        working-directory: applications/operations-web
        run: pnpm build
