spring.application.name=LedgerOps
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level application=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} %msg%n
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual_immediate
ledgerops.messaging.publisher.enabled=false
ledgerops.provider.command-consumer.enabled=false
ledgerops.provider.execution.enabled=false
ledgerops.provider.health.enabled=false
ledgerops.notification.enabled=false
ledgerops.notification.worker.enabled=false
ledgerops.payment.result-consumer.enabled=false
ledgerops.payment.retry-consumer.enabled=false
ledgerops.provider.webhook.enabled=false
ledgerops.provider.webhook.processing.enabled=false
ledgerops.observability.kafka-lag.enabled=false
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
ledgerops.reconciliation.storage.endpoint=${LEDGEROPS_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
ledgerops.reconciliation.storage.region=${LEDGEROPS_OBJECT_STORAGE_REGION:us-east-1}
ledgerops.reconciliation.storage.access-key=${LEDGEROPS_OBJECT_STORAGE_ACCESS_KEY:minioadmin}
ledgerops.reconciliation.storage.secret-key=${LEDGEROPS_OBJECT_STORAGE_SECRET_KEY:minioadmin}
ledgerops.reconciliation.storage.bucket=${LEDGEROPS_OBJECT_STORAGE_BUCKET:ledgerops-test-settlements}
ledgerops.reconciliation.storage.path-style-access=true
