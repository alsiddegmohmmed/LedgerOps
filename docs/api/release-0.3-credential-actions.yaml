openapi: 3.1.0
info:
  title: LedgerOps Release 0.3 Credential Actions
  version: 0.3.0
  description: >-
    Authenticated human actions for creating, rotating, and revoking sandbox
    service credentials. Client secrets are disclosed only in successful create
    and rotate responses and are never returned by revoke.
  x-release: "0.3"
  x-scope: credential-actions
paths:
  /api/v1/tenants/{tenantId}/credentials/{credentialId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CredentialId'
    get:
      operationId: getServiceCredentialMetadata
      summary: Read non-secret sandbox service credential metadata
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Non-secret credential metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialMetadataResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/tenants/{tenantId}/credentials:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: provisionServiceCredential
      summary: Provision a sandbox service credential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialProvisioningRequest'
      responses:
        '201':
          description: Credential provisioned and its one-time secret disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialProvisioningResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/tenants/{tenantId}/credentials/{credentialId}/rotate:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CredentialId'
    post:
      operationId: rotateServiceCredential
      summary: Rotate a sandbox service credential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialActionRequest'
      responses:
        '201':
          description: Replacement credential provisioned and its one-time secret disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRotationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

  /api/v1/tenants/{tenantId}/credentials/{credentialId}/revoke:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CredentialId'
    post:
      operationId: revokeServiceCredential
      summary: Revoke a sandbox service credential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialActionRequest'
      responses:
        '200':
          description: Credential was revoked without secret disclosure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRevocationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth2
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialId:
      name: credentialId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is invalid
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication is required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The authenticated actor cannot perform the action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: The resource is outside the actor's effective scope
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: The action conflicts with current credential state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: The local state is durable and external cleanup/provisioning can be retried
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CredentialMetadataResponse:
      type: object
      additionalProperties: false
      required: [credentialId, tenantId, merchantId, label, keycloakClientId, status, provisioningOperationId, disclosureStatus, createdAt, updatedAt]
      properties:
        credentialId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        label:
          type: string
        keycloakClientId:
          type: string
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, FAILED, REVOKED]
        provisioningOperationId:
          type: string
          format: uuid
        replacesCredentialId:
          type: string
          format: uuid
          nullable: true
        disclosureStatus:
          type: string
          enum: [PENDING, CONSUMED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CredentialProvisioningRequest:
      type: object
      additionalProperties: false
      required: [merchantId, label, confirmation, reason]
      properties:
        merchantId:
          type: string
          format: uuid
        label:
          type: string
          minLength: 1
          maxLength: 255
        confirmation:
          type: boolean
          const: true
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: Human-readable reason; secrets and tokens are not permitted.
    CredentialActionRequest:
      type: object
      additionalProperties: false
      required: [confirmation, reason]
      properties:
        confirmation:
          type: boolean
          const: true
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: Human-readable reason; secrets and tokens are not permitted.
    CredentialProvisioningResponse:
      type: object
      additionalProperties: false
      required: [credentialId, operationId, tenantId, merchantId, keycloakClientId, clientSecret, status]
      properties:
        credentialId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        keycloakClientId:
          type: string
        clientSecret:
          type: string
          readOnly: true
          description: One-time secret; it is not persisted or returned by later reads.
        status:
          type: string
          const: ACTIVE
    CredentialRotationResponse:
      type: object
      additionalProperties: false
      required: [previousCredentialId, credentialId, operationId, tenantId, merchantId, keycloakClientId, clientSecret, status]
      properties:
        previousCredentialId:
          type: string
          format: uuid
        credentialId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        keycloakClientId:
          type: string
        clientSecret:
          type: string
          readOnly: true
          description: One-time replacement secret; it is not persisted or returned by later reads.
        status:
          type: string
          const: ACTIVE
    CredentialRevocationResponse:
      type: object
      additionalProperties: false
      required: [credentialId, operationId, tenantId, merchantId, keycloakClientId, status]
      properties:
        credentialId:
          type: string
          format: uuid
        operationId:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
        merchantId:
          type: string
          format: uuid
        keycloakClientId:
          type: string
        status:
          type: string
          const: REVOKED
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, code, correlationId, effect, retryable, nextAction]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        correlationId:
          type: string
        effect:
          type: string
        retryable:
          type: boolean
        nextAction:
          type: string
