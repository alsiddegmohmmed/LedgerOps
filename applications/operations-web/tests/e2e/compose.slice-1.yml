services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ledgerops
      POSTGRES_USER: ledgerops
      POSTGRES_PASSWORD: local-ledgerops
    ports: ["${E2E_POSTGRES_PORT}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerops -d ledgerops"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports: ["${E2E_REDIS_PORT}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: ["start-dev", "--http-port=8180", "--health-enabled=true", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["${E2E_KEYCLOAK_PORT}:8180"]
    volumes:
      - ./keycloak-realm.json:/opt/keycloak/data/import/ledgerops-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 5s
      timeout: 5s
      retries: 30
